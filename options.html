<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Settings</title>

        <style>
            :root {
                color-scheme: dark;
                background: #000;
            }

            * {
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                margin: 0;
                padding: 20px;
                background: #000;
                color: #fff;
                min-width: 400px;
            }

            .container {
                background: #0a0a0a;
                padding: 24px;
                border: 1px solid #333;
                border-radius: 0;
                box-shadow: none;
            }

            h1 {
                margin: 0 0 24px 0;
                color: #fff;
                font-size: 24px;
                font-weight: 600;
            }

            .setting {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 16px 0;
                border-bottom: 1px solid #2a2a2a;
            }

            .setting:last-child {
                border-bottom: none;
            }

            .setting.setting-vertical {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .setting-info {
                flex: 1;
            }

            .setting-title {
                font-size: 16px;
                font-weight: 500;
                color: #fff;
                margin: 0 0 4px 0;
            }

            .setting-description {
                font-size: 14px;
                color: #aaa;
                margin: 0;
            }

            .setting-note {
                font-size: 14px;
                color: #999;
                margin-top: 4px;
            }

            .setting-control {
                margin-left: 16px;
                align-self: center;
            }

            .toggle {
                position: relative;
                display: inline-block;
                width: 48px;
                height: 24px;
                flex: 0 0 auto;
                margin-left: 16px;
            }

            .toggle input {
                opacity: 0;
                width: 0;
                height: 0;
            }

            .slider {
                position: absolute;
                cursor: pointer;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: #222;
                border: 1px solid #fff;
                transition: 0.2s;
                border-radius: 0;
            }

            .slider:before {
                position: absolute;
                content: "";
                height: 16px;
                width: 16px;
                left: 3px;
                top: 3.25px;
                background-color: #fff;
                transition: 0.2s;
                border-radius: 0;
            }

            input:checked + .slider {
                background-color: #0f73ff;
                border-color: #fff;
            }

            input:checked + .slider:before {
                transform: translateX(24px);
                background-color: #fff;
            }

            .toggle input:disabled + .slider {
                opacity: 0.45;
                cursor: not-allowed;
            }

            .setting-note.warning {
                color: #fff;
            }

            .status-panel {
                display: none;
                margin: 0 0 16px 0;
                padding: 12px;
                border: 1px solid #777;
                border-radius: 0;
                background: #111;
                color: #ddd;
                font-size: 13px;
                line-height: 1.45;
            }

            .status-panel strong {
                display: block;
                margin-bottom: 4px;
                color: #fff;
            }

            select {
                padding: 8px 12px;
                border: 1px solid #555;
                border-radius: 0;
                background: #050505;
                font-size: 14px;
                color: #fff;
                cursor: pointer;
                min-width: 80px;
            }

            select:focus {
                outline: 1px solid #fff;
                border-color: #fff;
                box-shadow: none;
            }

            .setting-controls {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .site-row {
                display: grid;
                grid-template-columns: 140px minmax(0, 220px) auto;
                align-items: center;
                gap: 8px;
                width: 100%;
                justify-content: start;
            }

            .site-row.site-row-manual {
                grid-template-columns: 140px minmax(0, 180px) auto;
            }

            #manualSiteInput {
                max-width: 119px;
                justify-self: start;
            }

            .site-row label {
                font-size: 14px;
                color: #ddd;
            }

            .site-row input,
            .site-row select {
                width: 100%;
                min-width: 0;
            }

            .site-row input {
                padding: 8px 12px;
                border: 1px solid #555;
                border-radius: 0;
                background: #050505;
                font-size: 14px;
                color: #fff;
            }

            .site-row input:focus {
                outline: 1px solid #fff;
                border-color: #fff;
                box-shadow: none;
            }

            .button {
                padding: 8px 12px;
                border: 1px solid #555;
                border-radius: 0;
                background: #111;
                color: #fff;
                font-size: 14px;
                cursor: pointer;
                white-space: nowrap;
            }

            .button:hover {
                background: #222;
                border-color: #777;
            }

            .button:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }

            .button.button-small {
                padding: 6px 10px;
                font-size: 13px;
            }

            .site-list {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .site-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 8px 12px;
                border: 1px solid #333;
                border-radius: 0;
                background: #0d0d0d;
                font-size: 14px;
            }

            .site-item span {
                color: #ddd;
            }

            .debug-actions {
                margin-top: 8px;
            }

            input::placeholder {
                color: #777;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <h1>Options</h1>

            <div class="status-panel" id="autoPipBlockerStatus"></div>

            <div class="setting">
                <div class="setting-info">
                    <div class="setting-title">Auto PiP on Tab Switch</div>
                    <div class="setting-description">
                        Automatically activate PiP when switching to a different
                        tab in the same window.
                    </div>
                </div>
                <label class="toggle">
                    <input type="checkbox" id="autoPipOnTabSwitch" />
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting">
                <div class="setting-info">
                    <div class="setting-title">PiP Button in Player</div>
                    <div class="setting-description">
                        Show the PiP button inside video players.
                    </div>
                </div>
                <label class="toggle">
                    <input type="checkbox" id="pipButtonEnabled" />
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting">
                <div class="setting-info">
                    <div class="setting-title">Debug Logs</div>
                    <div class="debug-actions">
                        <button class="button" id="downloadDebugLog">Download .txt</button>
                    </div>
                </div>
                <label class="toggle">
                    <input type="checkbox" id="autoPipDebugEnabled" />
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting setting-vertical" id="blockedSitesSetting">
                <div class="setting-info">
                    <div class="setting-title">Disabled Sites</div>
                    <div class="setting-description">
                        Auto PiP will not run on these domains. Use a
                        <code>*.</code> prefix to include subdomains (e.g.
                        <code>*.zoom.us</code>).
                    </div>
                </div>
                <div class="setting-controls">
                    <div class="site-row">
                        <label for="currentSiteSelect">Add an open site</label>
                        <select id="currentSiteSelect">
                            <option value="">Select a site</option>
                        </select>
                        <button class="button" id="addCurrentSite">Add</button>
                    </div>
                    <div class="site-row site-row-manual">
                        <label for="manualSiteInput">Add manually</label>
                        <input id="manualSiteInput" type="text" />
                        <button class="button" id="addManualSite">Add</button>
                    </div>
                </div>
                <div class="site-list" id="blockedSitesList"></div>
            </div>

        </div>

        <script src="options.js"></script>
    </body>
</html>
